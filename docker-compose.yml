services:
  db-stock-data:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_data
    volumes:
      - data-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    command: python3 -B -m uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app/backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db-stock-data:5432/stock_data?sslmode=disable
    volumes:
      - ~/.vnstock:/root/.vnstock:ro
    depends_on:
      db-stock-data:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser must hit a URL it can resolve from outside Docker (VPS public IP/domain).
        NEXT_PUBLIC_BACKEND_URL: http://194.34.232.128:8000
    ports:
      - "2222:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://194.34.232.128:8000
    depends_on:
      - backend

volumes:
  data-volume:
